<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#f7f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TXT Reader">

  <link rel="manifest" href="manifest.webmanifest">
  <title>TXT Reader</title>

  <style>
    :root {
      --bg: #f7f4ee;
      --paper: #fffdf9;
      --text: #252525;
      --muted: #777;
      --accent: #8b5e3c;
      --system: #f1eee8;
      --border: #e4ded4;
      --reader-size: 19px;
      --reader-line-height: 1.9;
    }

    body[data-theme="dark"] {
      --bg: #171717;
      --paper: #202020;
      --text: #f0ece6;
      --muted: #b8b1a8;
      --accent: #d5a476;
      --system: #2b2926;
      --border: #3d3934;
    }

    body[data-theme="sepia"] {
      --bg: #f7f4ee;
      --paper: #fffdf9;
      --text: #252525;
      --muted: #777;
      --accent: #8b5e3c;
      --system: #f1eee8;
      --border: #e4ded4;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans Thai",
        "Leelawadee UI",
        "Segoe UI",
        sans-serif;
    }

    body {
      font-size: 16px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       LIBRARY
       ========================================================= */

    .app {
      width: min(100%, 820px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        calc(16px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));
    }

    .topbar-library {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 3px;
      font-size: 25px;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 20px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 13px;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 12px;
      font-weight: 700;
    }

    .tool {
      min-width: 38px;
      min-height: 34px;
      padding: 6px 11px;
      color: var(--text);
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
    }

    .tool.danger {
      color: #b42318;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row.between {
      justify-content: space-between;
    }

    .empty {
      padding: 28px 8px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .book-row,
    .history-item,
    .chapter-item {
      display: flex;
      width: 100%;
      padding: 13px 0;
      color: var(--text);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .book-row:last-child,
    .history-item:last-child,
    .chapter-item:last-child {
      border-bottom: 0;
    }

    .book-main {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      display: block;
      margin-bottom: 4px;
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-meta {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .progress {
      height: 6px;
      margin-top: 9px;
      overflow: hidden;
      background: var(--border);
      border-radius: 999px;
    }

    .progress span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
    }

    #fileInput {
      display: none;
    }

    /* =========================================================
       READER - รูปแบบคล้าย HTML เก่า
       ========================================================= */

    .reader-shell {
      width: min(100%, 820px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        calc(28px + env(safe-area-inset-top))
        clamp(18px, 5vw, 48px)
        calc(118px + env(safe-area-inset-bottom));
      background: var(--paper);
    }

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin:
        calc(-28px - env(safe-area-inset-top))
        calc(-1 * clamp(18px, 5vw, 48px))
        30px;

      padding:
        calc(12px + env(safe-area-inset-top))
        clamp(18px, 5vw, 48px)
        12px;

      background: color-mix(in srgb, var(--paper) 94%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .reader-brand {
      max-width: 42%;
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader-controls {
      display: flex;
      gap: 6px;
    }

    .reader-content {
      color: var(--text);
      font-size: var(--reader-size);
      line-height: var(--reader-line-height);
      text-wrap: pretty;
      word-break: break-word;
    }

    .episode-heading,
    .reader-content .chapter {
      color: var(--text);
      font-weight: 750;
      line-height: 1.35;
    }

    /* หัวข้อ "ตอนที่" หลัก */
    .episode-heading {
      margin: 8px 0 28px;
      font-size: clamp(25px, 6vw, 34px);
    }

    /* หัวข้อ "บทที่" ภายในตอน */
    .reader-content .chapter {
      margin: 46px 0 28px;
      font-size: clamp(23px, 5.5vw, 31px);
    }

    .reader-content p {
      margin: 0 0 1em;
      text-align: left;
      text-indent: 0;
    }

    /* [ข้อความระบบ] */
    .reader-content .system {
      margin: 1.1em 0;
      padding: 10px 14px;
      background: var(--system);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      font-size: 0.92em;
      line-height: 1.65;
    }

    /* Marker 4 ตัวอักษร เช่น ABCD */
    .reader-content .marker {
      width: fit-content;
      margin: 18px auto;
      padding: 7px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    /* ........ / ………… */
    .reader-content .separator {
      margin: 34px 0;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.5em;
    }

    .reader-bottom {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 15;
      padding:
        10px
        16px
        calc(10px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .reader-bottom-inner {
      display: flex;
      max-width: 720px;
      margin: 0 auto;
      gap: 8px;
    }

    .nav-button {
      flex: 1;
      min-height: 42px;
      padding: 9px 8px;
      color: var(--text);
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-weight: 650;
    }

    .nav-button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    /* =========================================================
       MODAL
       ========================================================= */

    .modal {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: flex;
      align-items: flex-end;
      background: rgba(0, 0, 0, 0.38);
    }

    .modal-panel {
      width: 100%;
      max-height: 82vh;
      padding:
        20px
        16px
        calc(20px + env(safe-area-inset-bottom));
      overflow-y: auto;
      background: var(--bg);
      border-radius: 20px 20px 0 0;
    }

    .modal-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    input[type="search"],
    select {
      width: 100%;
      padding: 11px;
      color: var(--text);
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
    }

    input[type="search"] {
      margin-bottom: 10px;
    }

    select {
      width: auto;
    }

    .chapter-number {
      color: var(--accent);
      font-weight: 800;
    }

    @media (max-width: 600px) {
      .reader-shell {
        padding-top: calc(20px + env(safe-area-inset-top));
      }

      .reader-header {
        margin-top: calc(-20px - env(safe-area-inset-top));
        margin-bottom: 24px;
      }

      .reader-content .chapter {
        margin-top: 38px;
      }

      .reader-brand {
        max-width: 34%;
      }
    }

    @media (min-width: 900px) {
      :root {
        --reader-size: 20px;
      }
    }
  </style>
</head>

<body data-theme="sepia">
  <main class="app">
    <!-- ชั้นหนังสือ -->
    <section id="libraryView">
      <header class="topbar-library">
        <div>
          <h1>ชั้นหนังสือ</h1>
          <div class="muted">หนังสือและประวัติการอ่านเก็บอยู่ในเครื่องนี้</div>
        </div>

        <label class="button" for="fileInput">นำเข้า TXT</label>
        <input id="fileInput" type="file" accept=".txt,text/plain" multiple>
      </header>

      <div id="libraryContent"></div>
    </section>

    <!-- หน้าอ่าน -->
    <section id="readerView" class="hidden">
      <main class="reader-shell">
        <header class="reader-header">
          <div class="reader-brand" id="readerBookTitle">TXT Reader</div>

          <div class="reader-controls">
            <button class="tool" id="backButton">กลับ</button>
            <button class="tool" id="tocButton">สารบัญ</button>
            <button class="tool" id="bookmarkButton">คั่น</button>
            <button class="tool" id="settingsButton">A</button>
          </div>
        </header>

        <article class="reader-content" id="readerContent"></article>
      </main>

      <footer class="reader-bottom">
        <div class="reader-bottom-inner">
          <button class="nav-button" id="previousButton">‹ ตอนก่อน</button>
          <button class="nav-button" id="nextButton">ตอนถัดไป ›</button>
        </div>
      </footer>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal hidden" id="modal">
    <div class="modal-panel" id="modalPanel"></div>
  </div>

  <script>
    const DB_NAME = "ThaiTXTReaderDB";
    const STORE_NAME = "books";

    let currentBook = null;
    let currentEpisodeIndex = 0;
    let saveTimer = null;

    const settings = JSON.parse(
      localStorage.getItem("readerSettings") ||
      JSON.stringify({
        theme: "sepia",
        fontSize: 19,
        lineHeight: 1.9
      })
    );

    function applySettings() {
      document.body.dataset.theme = settings.theme;
      document.documentElement.style.setProperty(
        "--reader-size",
        `${settings.fontSize}px`
      );
      document.documentElement.style.setProperty(
        "--reader-line-height",
        settings.lineHeight
      );

      localStorage.setItem("readerSettings", JSON.stringify(settings));
    }

    applySettings();

    /* =========================================================
       DATABASE
       ========================================================= */

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = () => {
          const db = request.result;

          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function getAllBooks() {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const request = db
          .transaction(STORE_NAME, "readonly")
          .objectStore(STORE_NAME)
          .getAll();

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveBook(book) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, "readwrite");
        transaction.objectStore(STORE_NAME).put(book);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    async function deleteBook(id) {
      const db = await openDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, "readwrite");
        transaction.objectStore(STORE_NAME).delete(id);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    /* =========================================================
       HELPERS
       ========================================================= */

    function createId() {
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function escapeHTML(text = "") {
      const element = document.createElement("div");
      element.textContent = text;
      return element.innerHTML;
    }

    function getProgressPercent(book) {
      if (!book?.episodes?.length || !book?.progress?.episodeId) {
        return 0;
      }

      const index = book.episodes.findIndex(
        episode => episode.id === book.progress.episodeId
      );

      if (index < 0) {
        return 0;
      }

      const scrollRatio = Math.min(
        Math.max(book.progress.scrollRatio || 0, 0),
        1
      );

      return Math.round(
        ((index + scrollRatio) / book.episodes.length) * 100
      );
    }

    /* =========================================================
       IMPORT TXT
       ========================================================= */

    function parseEpisodes(rawText) {
      const lines = rawText
        .replace(/\r\n?/g, "\n")
        .split("\n");

      const episodes = [];
      let activeEpisode = null;

      /*
        นับเฉพาะ:
        ตอนที่ 201: ...
        ตอนที่ 201 : ...
        ตอนที่ 201 ...
      */
      const episodePattern = /^\s*ตอนที่\s*(\d+)\s*[:：]?\s*(.*?)\s*$/u;

      for (const rawLine of lines) {
        const line = rawLine.trim();
        const match = line.match(episodePattern);

        if (match) {
          if (activeEpisode) {
            activeEpisode.content = activeEpisode.content.join("\n").trim();
            episodes.push(activeEpisode);
          }

          activeEpisode = {
            id: `episode-${match[1]}-${episodes.length}`,
            number: Number(match[1]),
            title: match[2] || `ตอนที่ ${match[1]}`,
            heading: line,
            content: []
          };

          continue;
        }

        /*
          “บทที่” และข้อความอื่นทั้งหมด
          จะถูกเก็บไว้ในตอนล่าสุด
          แต่ไม่ถูกนับเป็นตอนในสารบัญ
        */
        if (activeEpisode) {
          activeEpisode.content.push(rawLine);
        }
      }

      if (activeEpisode) {
        activeEpisode.content = activeEpisode.content.join("\n").trim();
        episodes.push(activeEpisode);
      }

      /*
        หากไฟล์ไม่มี "ตอนที่" เลย
        ให้ยังอ่านได้เป็นตอนเดียว
      */
      if (!episodes.length && rawText.trim()) {
        episodes.push({
          id: "episode-1",
          number: 1,
          title: "เนื้อหา",
          heading: "เนื้อหา",
          content: rawText.trim()
        });
      }

      return episodes;
    }

    function formatEpisodeContent(content) {
      const lines = content
        .replace(/\r\n?/g, "\n")
        .split("\n");

      const parts = [];

      for (const rawLine of lines) {
        const line = rawLine.trim();

        /* ข้ามบรรทัดว่าง เหมือน Python เดิม */
        if (!line) {
          continue;
        }

        const escaped = escapeHTML(line);

        /*
          บทที่ 202 : ...
          แสดงเป็นหัวข้อ แต่ไม่สร้างตอนใหม่
        */
        if (/^บทที่\s*\d+\s*[:：]?/u.test(line)) {
          parts.push(`<h2 class="chapter">${escaped}</h2>`);
        }

        /* [ข้อความระบบ] */
        else if (line.startsWith("[") && line.endsWith("]")) {
          parts.push(`<div class="system">${escaped}</div>`);
        }

        /* Marker 4 ตัวอักษรภาษาอังกฤษ */
        else if (/^[A-Za-z]{4}$/.test(line)) {
          parts.push(`<div class="marker">${escaped}</div>`);
        }

        /* ........ หรือ ………… */
        else if (/^[.…]{4,}$/u.test(line)) {
          parts.push(`<div class="separator">•••</div>`);
        }

        /* ข้อความปกติ */
        else {
          parts.push(`<p>${escaped}</p>`);
        }
      }

      return parts.join("\n");
    }

    /* =========================================================
       LIBRARY
       ========================================================= */

    async function renderLibrary() {
      const books = await getAllBooks();

      books.sort((a, b) => {
        const timeA = a.progress?.updatedAt || a.createdAt;
        const timeB = b.progress?.updatedAt || b.createdAt;
        return timeB - timeA;
      });

      const libraryContent = document.getElementById("libraryContent");

      if (!books.length) {
        libraryContent.innerHTML = `
          <div class="card empty">
            <strong>ยังไม่มีหนังสือ</strong><br>
            กด “นำเข้า TXT” แล้วเลือกไฟล์จากแอป Files<br>
            สามารถเลือกหลายไฟล์เพื่อรวมเป็นเล่มเดียวได้
          </div>
        `;

        return;
      }

      libraryContent.innerHTML = `
        <div class="card">
          <div class="row between">
            <h2>หนังสือทั้งหมด</h2>
            <span class="muted">${books.length} เล่ม</span>
          </div>

          ${books.map(book => {
            const currentEpisode = book.episodes.find(
              episode => episode.id === book.progress?.episodeId
            );

            const progress = getProgressPercent(book);

            return `
              <div class="book-row">
                <button
                  class="book-main"
                  data-open-book="${book.id}"
                >
                  <span class="item-title">${escapeHTML(book.title)}</span>
                  <span class="item-meta">
                    ${book.episodes.length} ตอน
                    ${currentEpisode ? ` · ล่าสุด ตอนที่ ${currentEpisode.number}` : ""}
                    · อ่านแล้ว ${progress}%
                  </span>

                  <div class="progress">
                    <span style="width: ${progress}%"></span>
                  </div>
                </button>

                <button
                  class="tool danger"
                  data-delete-book="${book.id}"
                  aria-label="ลบหนังสือ"
                >
                  ลบ
                </button>
              </div>
            `;
          }).join("")}
        </div>
      `;

      document.querySelectorAll("[data-open-book]").forEach(button => {
        button.addEventListener("click", () => {
          openBook(button.dataset.openBook);
        });
      });

      document.querySelectorAll("[data-delete-book]").forEach(button => {
        button.addEventListener("click", async () => {
          const confirmed = confirm(
            "ต้องการลบหนังสือเล่มนี้ รวมถึงประวัติและคั่นหน้าหรือไม่?"
          );

          if (!confirmed) {
            return;
          }

          await deleteBook(button.dataset.deleteBook);
          renderLibrary();
        });
      });
    }

    /* =========================================================
       READER
       ========================================================= */

    async function openBook(bookId, requestedEpisodeId = null) {
      const books = await getAllBooks();

      currentBook = books.find(book => book.id === bookId);

      if (!currentBook) {
        return;
      }

      const targetEpisodeId =
        requestedEpisodeId ||
        currentBook.progress?.episodeId;

      const savedIndex = currentBook.episodes.findIndex(
        episode => episode.id === targetEpisodeId
      );

      currentEpisodeIndex = savedIndex >= 0 ? savedIndex : 0;

      document.getElementById("libraryView").classList.add("hidden");
      document.getElementById("readerView").classList.remove("hidden");

      renderCurrentEpisode(true);
    }

    function renderCurrentEpisode(restorePosition = false) {
      const episode = currentBook.episodes[currentEpisodeIndex];

      document.getElementById("readerBookTitle").textContent = currentBook.title;

      document.getElementById("readerContent").innerHTML = `
        <h1 class="episode-heading" id="${episode.id}">
          ${escapeHTML(episode.heading)}
        </h1>

        ${formatEpisodeContent(episode.content)}
      `;

      document.getElementById("previousButton").disabled =
        currentEpisodeIndex === 0;

      document.getElementById("nextButton").disabled =
        currentEpisodeIndex === currentBook.episodes.length - 1;

      const params = new URLSearchParams({
        book: currentBook.id,
        episode: episode.id
      });

      history.replaceState(null, "", `#${params.toString()}`);

      const isLastReadEpisode =
        currentBook.progress?.episodeId === episode.id;

      setTimeout(() => {
        const savedPosition =
          restorePosition && isLastReadEpisode
            ? currentBook.progress?.scrollY || 0
            : 0;

        window.scrollTo(0, savedPosition);
      }, 40);

      saveReadingProgress();
    }

    function saveReadingProgress() {
      if (!currentBook) {
        return;
      }

      clearTimeout(saveTimer);

      saveTimer = setTimeout(async () => {
        const episode = currentBook.episodes[currentEpisodeIndex];

        const maxScroll = Math.max(
          document.documentElement.scrollHeight - window.innerHeight,
          1
        );

        currentBook.progress = {
          episodeId: episode.id,
          scrollY: window.scrollY,
          scrollRatio: Math.min(window.scrollY / maxScroll, 1),
          updatedAt: Date.now()
        };

        await saveBook(currentBook);
      }, 500);
    }

    /* =========================================================
       TABLE OF CONTENTS
       ========================================================= */

    function showTOC() {
      const episodeList = currentBook.episodes.map((episode, index) => `
        <button
          class="chapter-item"
          data-episode-index="${index}"
        >
          <div>
            <span class="item-title">
              <span class="chapter-number">ตอนที่ ${episode.number}</span>
              ${episode.title ? `: ${escapeHTML(episode.title)}` : ""}
            </span>

            <span class="item-meta">
              ${episode.id === currentBook.progress?.episodeId
                ? "กำลังอ่านล่าสุด"
                : ""
              }
            </span>
          </div>
        </button>
      `).join("");

      showModal(`
        <div class="modal-title">
          <h2>สารบัญ</h2>
          <button class="tool" data-close-modal>ปิด</button>
        </div>

        <input
          id="episodeSearch"
          type="search"
          placeholder="ค้นหาเลขตอน หรือชื่อเรื่อง"
        >

        <div id="episodeList">
          ${episodeList}
        </div>
      `);

      document.querySelectorAll("[data-episode-index]").forEach(button => {
        button.addEventListener("click", () => {
          currentEpisodeIndex = Number(button.dataset.episodeIndex);
          closeModal();
          renderCurrentEpisode(false);
        });
      });

      document
        .getElementById("episodeSearch")
        .addEventListener("input", event => {
          const keyword = event.target.value.toLowerCase().trim();

          document.querySelectorAll("[data-episode-index]").forEach(button => {
            const found = button.textContent.toLowerCase().includes(keyword);
            button.classList.toggle("hidden", !found);
          });
        });
    }

    /* =========================================================
       BOOKMARKS
       ========================================================= */

    async function addBookmark() {
      const episode = currentBook.episodes[currentEpisodeIndex];

      const note = prompt(
        "เพิ่มโน้ตสำหรับคั่นหน้านี้ (เว้นว่างได้)"
      );

      if (note === null) {
        return;
      }

      const maxScroll = Math.max(
        document.documentElement.scrollHeight - window.innerHeight,
        1
      );

      currentBook.bookmarks = currentBook.bookmarks || [];

      currentBook.bookmarks.unshift({
        id: createId(),
        episodeId: episode.id,
        episodeNumber: episode.number,
        episodeTitle: episode.title,
        scrollY: window.scrollY,
        scrollRatio: window.scrollY / maxScroll,
        note: note.trim(),
        createdAt: Date.now()
      });

      await saveBook(currentBook);
      alert("บันทึกคั่นหน้าแล้ว");
    }

    function showBookmarks() {
      const bookmarks = currentBook.bookmarks || [];

      showModal(`
        <div class="modal-title">
          <h2>คั่นหน้า</h2>
          <button class="tool" data-close-modal>ปิด</button>
        </div>

        ${
          bookmarks.length
            ? bookmarks.map(bookmark => `
              <button
                class="chapter-item"
                data-bookmark-id="${bookmark.id}"
              >
                <div>
                  <span class="item-title">
                    ตอนที่ ${bookmark.episodeNumber}
                    ${bookmark.episodeTitle ? `: ${escapeHTML(bookmark.episodeTitle)}` : ""}
                  </span>

                  <span class="item-meta">
                    ${escapeHTML(bookmark.note || "ไม่มีโน้ต")}
                  </span>
                </div>
              </button>
            `).join("")
            : `<div class="empty">ยังไม่มีคั่นหน้า</div>`
        }
      `);

      document.querySelectorAll("[data-bookmark-id]").forEach(button => {
        button.addEventListener("click", () => {
          const bookmark = currentBook.bookmarks.find(
            item => item.id === button.dataset.bookmarkId
          );

          if (!bookmark) {
            return;
          }

          const index = currentBook.episodes.findIndex(
            episode => episode.id === bookmark.episodeId
          );

          if (index < 0) {
            return;
          }

          currentEpisodeIndex = index;
          closeModal();
          renderCurrentEpisode(false);

          setTimeout(() => {
            window.scrollTo(0, bookmark.scrollY || 0);
          }, 70);
        });
      });
    }

    /* =========================================================
       SETTINGS
       ========================================================= */

    function showSettings() {
      showModal(`
        <div class="modal-title">
          <h2>รูปแบบการอ่าน</h2>
          <button class="tool" data-close-modal>ปิด</button>
        </div>

        <div class="settings-row">
          <span>ธีม</span>

          <select id="themeSetting">
            <option value="light">สว่าง</option>
            <option value="sepia">ซีเปีย</option>
            <option value="dark">มืด</option>
          </select>
        </div>

        <div class="settings-row">
          <span>ขนาดตัวอักษร</span>

          <div class="row">
            <button class="tool" id="fontDown">A−</button>
            <strong id="fontValue">${settings.fontSize}</strong>
            <button class="tool" id="fontUp">A+</button>
          </div>
        </div>

        <div class="settings-row">
          <span>ระยะห่างบรรทัด</span>

          <select id="lineSetting">
            <option value="1.7">กระชับ</option>
            <option value="1.9">ปกติ</option>
            <option value="2.2">โปร่ง</option>
          </select>
        </div>

        <div style="margin-top: 16px;">
          <button class="button" id="showBookmarksButton">
            ดูคั่นหน้าทั้งหมด
          </button>
        </div>
      `);

      const themeSetting = document.getElementById("themeSetting");
      const lineSetting = document.getElementById("lineSetting");

      themeSetting.value = settings.theme;
      lineSetting.value = String(settings.lineHeight);

      themeSetting.addEventListener("change", () => {
        settings.theme = themeSetting.value;
        applySettings();
      });

      lineSetting.addEventListener("change", () => {
        settings.lineHeight = Number(lineSetting.value);
        applySettings();
      });

      document.getElementById("fontDown").addEventListener("click", () => {
        settings.fontSize = Math.max(16, settings.fontSize - 1);
        document.getElementById("fontValue").textContent = settings.fontSize;
        applySettings();
      });

      document.getElementById("fontUp").addEventListener("click", () => {
        settings.fontSize = Math.min(28, settings.fontSize + 1);
        document.getElementById("fontValue").textContent = settings.fontSize;
        applySettings();
      });

      document
        .getElementById("showBookmarksButton")
        .addEventListener("click", showBookmarks);
    }

    /* =========================================================
       MODAL
       ========================================================= */

    function showModal(content) {
      const modal = document.getElementById("modal");
      const panel = document.getElementById("modalPanel");

      panel.innerHTML = content;
      modal.classList.remove("hidden");

      const closeButton = panel.querySelector("[data-close-modal]");

      if (closeButton) {
        closeButton.addEventListener("click", closeModal);
      }
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
    }

    /* =========================================================
       EVENTS
       ========================================================= */

    document
      .getElementById("fileInput")
      .addEventListener("change", async event => {
        const files = [...event.target.files];

        if (!files.length) {
          return;
        }

        const defaultTitle =
          files.length === 1
            ? files[0].name.replace(/\.[^/.]+$/, "")
            : "นิยายที่นำเข้า";

        const title = prompt("ตั้งชื่อหนังสือ", defaultTitle);

        if (title === null) {
          event.target.value = "";
          return;
        }

        const texts = await Promise.all(
          files.map(file => file.text())
        );

        const combinedText = texts.join("\n\n");
        const episodes = parseEpisodes(combinedText);

        if (!episodes.length) {
          alert("ไม่พบข้อความในไฟล์ที่เลือก");
          return;
        }

        const book = {
          id: createId(),
          title: title.trim() || "หนังสือไม่มีชื่อ",
          episodes,
          bookmarks: [],
          progress: null,
          createdAt: Date.now()
        };

        await saveBook(book);

        event.target.value = "";

        await renderLibrary();
        openBook(book.id);
      });

    document.getElementById("backButton").addEventListener("click", async () => {
      saveReadingProgress();

      document.getElementById("readerView").classList.add("hidden");
      document.getElementById("libraryView").classList.remove("hidden");

      history.replaceState(null, "", location.pathname);

      await renderLibrary();
    });

    document.getElementById("tocButton").addEventListener("click", showTOC);
    document.getElementById("bookmarkButton").addEventListener("click", addBookmark);
    document.getElementById("settingsButton").addEventListener("click", showSettings);

    document.getElementById("previousButton").addEventListener("click", () => {
      if (currentEpisodeIndex <= 0) {
        return;
      }

      currentEpisodeIndex--;
      renderCurrentEpisode(false);
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      if (currentEpisodeIndex >= currentBook.episodes.length - 1) {
        return;
      }

      currentEpisodeIndex++;
      renderCurrentEpisode(false);
    });

    window.addEventListener("scroll", () => {
      const readerVisible = !document
        .getElementById("readerView")
        .classList
        .contains("hidden");

      if (readerVisible) {
        saveReadingProgress();
      }
    }, { passive: true });

    window.addEventListener("beforeunload", saveReadingProgress);

    document.getElementById("modal").addEventListener("click", event => {
      if (event.target.id === "modal") {
        closeModal();
      }
    });

    async function openFromURL() {
      const hash = location.hash.slice(1);

      if (!hash) {
        return;
      }

      const params = new URLSearchParams(hash);
      const bookId = params.get("book");
      const episodeId = params.get("episode");

      if (bookId) {
        await openBook(bookId, episodeId);
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }

    renderLibrary().then(openFromURL);
  </script>
</body>
</html>
